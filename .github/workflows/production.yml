name: Production build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.3.0
        required: true
        type: string

jobs:
  production:
    runs-on: macos-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          working-directory: apps/mobile
          bundler-cache: true

      - run: npm ci

      - name: Tag matches package.json
        run: |
          expected="v$(node -p "require('./apps/mobile/package.json').version")"
          if [ "$expected" != "${{ inputs.tag }}" ]; then
            echo "Tag does not match apps/mobile/package.json version ($expected)."
            exit 1
          fi

      - name: Write public production env
        run: |
          cat > apps/mobile/.env.production << 'EOF'
          GRAPHQL_URL=${{ vars.GRAPHQL_URL }}
          SENTRY_DSN=${{ vars.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE=${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
          EOF

      - name: Decode release keystore
        run: printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > apps/mobile/android/app/release.keystore

      - name: Install pods
        working-directory: apps/mobile/ios
        run: bundle exec pod install

      - name: Build number
        id: build
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Android App Bundle
        working-directory: apps/mobile
        env:
          ENVFILE: .env.production
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_URL: https://de.sentry.io
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bundle exec fastlane android production

      - name: iOS App Store IPA
        working-directory: apps/mobile
        env:
          ENVFILE: .env.production
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_URL: https://de.sentry.io
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane ios production

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: apps/mobile/android/app/build/outputs/bundle/prodRelease/*.aab
          retention-days: 5

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: apps/mobile/build/DesignSystem.ipa
          retention-days: 5
