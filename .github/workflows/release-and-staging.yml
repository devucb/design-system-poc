name: Release and staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Release line to run
        type: choice
        default: all
        options:
          - all
          - mobile
          - bff
          - root
      skip_ios:
        description: Skip the iOS staging job
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  changes:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.lines.outputs.mobile }}
      bff: ${{ steps.lines.outputs.bff }}
      root: ${{ steps.lines.outputs.root }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: lines
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            package="${{ inputs.package }}"
            for line in mobile bff root; do
              if [ "$package" = "all" ] || [ "$package" = "$line" ]; then
                echo "${line}=true" >> "$GITHUB_OUTPUT"
              else
                echo "${line}=false" >> "$GITHUB_OUTPUT"
              fi
            done
          else
            node scripts/release-lines.cjs "${{ github.event.before }}" "${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.bff == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    outputs:
      mobile_released: ${{ steps.release.outputs.mobile_released }}
      bff_released: ${{ steps.release.outputs.bff_released }}
      bff_version: ${{ steps.release.outputs.bff_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # semantic-release 25: node ^22.14.0 || >= 24.10.0
      # changelog and git plugins: node ^22.22.2 || >= 24.15
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: npm

      - run: npm ci

      - id: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # Release commits are generated here. Gitleaks still runs in its own workflow.
          HUSKY: "0"
          RUN_ROOT: ${{ needs.changes.outputs.root }}
          RUN_MOBILE: ${{ needs.changes.outputs.mobile }}
          RUN_BFF: ${{ needs.changes.outputs.bff }}
        run: |
          run_line() {
            local name="$1"
            local before after
            before=$(git rev-parse HEAD)
            RELEASE_LINE="$name" npx semantic-release
            after=$(git rev-parse HEAD)
            if [ "$before" != "$after" ]; then
              echo "${name}_released=true" >> "$GITHUB_OUTPUT"
              if [ "$name" = "bff" ]; then
                echo "bff_version=$(node -p "require('./apps/bff/package.json').version")" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "${name}_released=false" >> "$GITHUB_OUTPUT"
            fi
          }

          if [ "$RUN_ROOT" = "true" ]; then
            run_line root
          else
            echo "root_released=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$RUN_MOBILE" = "true" ]; then
            run_line mobile
          else
            echo "mobile_released=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$RUN_BFF" = "true" ]; then
            run_line bff
          else
            echo "bff_released=false" >> "$GITHUB_OUTPUT"
          fi

  staging-android:
    needs: [changes, release]
    if: needs.release.result == 'success' && (needs.release.outputs.mobile_released == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.package == 'mobile' || inputs.package == 'all')))
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          working-directory: apps/mobile
          bundler-cache: true

      - run: npm ci

      - name: Write public staging env
        run: |
          cat > apps/mobile/.env.staging << 'EOF'
          GRAPHQL_URL=${{ vars.GRAPHQL_URL }}
          SENTRY_DSN=${{ vars.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE=${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
          EOF

      - name: Decode Firebase service account
        run: printf '%s' "${{ secrets.FIREBASE_SA_JSON_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/firebase-sa.json"

      - name: Decode release keystore
        run: printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > apps/mobile/android/app/release.keystore

      - name: Build number
        id: build
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Android staging
        working-directory: apps/mobile
        env:
          ENVFILE: .env.staging
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          FIREBASE_SA_FILE: ${{ runner.temp }}/firebase-sa.json
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_URL: https://de.sentry.io
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bundle exec fastlane android staging

  staging-ios:
    needs: [changes, release]
    if: needs.release.result == 'success' && github.event.inputs.skip_ios != 'true' && (needs.release.outputs.mobile_released == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.package == 'mobile' || inputs.package == 'all')))
    runs-on: macos-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          working-directory: apps/mobile
          bundler-cache: true

      - run: npm ci

      - name: Write public staging env
        run: |
          cat > apps/mobile/.env.staging << 'EOF'
          GRAPHQL_URL=${{ vars.GRAPHQL_URL }}
          SENTRY_DSN=${{ vars.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE=${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
          EOF

      - name: Decode Firebase service account
        run: printf '%s' "${{ secrets.FIREBASE_SA_JSON_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/firebase-sa.json"

      - name: Install pods
        working-directory: apps/mobile/ios
        run: bundle exec pod install

      - name: Build number
        id: build
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: iOS staging
        working-directory: apps/mobile
        env:
          ENVFILE: .env.staging
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          FIREBASE_SA_FILE: ${{ runner.temp }}/firebase-sa.json
          FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_URL: https://de.sentry.io
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane ios staging

  bff:
    needs: [changes, release]
    if: needs.changes.outputs.bff == 'true' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: image
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/bff"
          {
            echo "tags<<EOF"
            echo "${image}:main"
            echo "${image}:${{ github.sha }}"
            if [ "${{ needs.release.outputs.bff_released }}" = "true" ]; then
              echo "${image}:bff-v${{ needs.release.outputs.bff_version }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/bff/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}

      - name: Deploy on Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ] || [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_DEPLOY_HOOK and RENDER_API_KEY secrets are required."
            exit 1
          fi
          service_id=$(printf '%s' "$RENDER_DEPLOY_HOOK" | sed -n 's#.*/deploy/\([^/?]*\).*#\1#p')
          if [ -z "$service_id" ]; then
            echo "Could not read the Render service id from RENDER_DEPLOY_HOOK."
            exit 1
          fi
          http_code=$(curl -sS -o /tmp/render-deploy.json -w '%{http_code}' -X POST "$RENDER_DEPLOY_HOOK")
          case "$http_code" in
            200|201|202) ;;
            *)
              echo "Render deploy hook returned HTTP $http_code."
              exit 1
              ;;
          esac
          deploy_id=$(jq -r '.deploy.id // empty' /tmp/render-deploy.json)
          if [ -z "$deploy_id" ]; then
            echo "Render queued the deploy without an id (HTTP $http_code)."
            exit 1
          fi
          echo "Render deploy ${deploy_id} on ${service_id}"
          for _ in $(seq 1 40); do
            status=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/${service_id}/deploys/${deploy_id}" \
              | jq -r '.status // "unknown"')
            echo "Render status: ${status}"
            case "$status" in
              live)
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                service=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
                  "https://api.render.com/v1/services/${service_id}")
                echo "Render deploy failed: ${status}"
                echo "$service" | jq -r '.dashboardUrl // empty'
                owner_id=$(printf '%s' "$service" | jq -r '.ownerId // empty')
                if [ -n "$owner_id" ]; then
                  curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
                    --get \
                    --data-urlencode "ownerId=${owner_id}" \
                    --data-urlencode "resource=${service_id}" \
                    --data-urlencode "type=build" \
                    --data-urlencode "direction=backward" \
                    --data-urlencode "limit=80" \
                    "https://api.render.com/v1/logs" \
                    | jq -r '.logs | reverse | .[].message'
                fi
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for Render deploy ${deploy_id}."
          exit 1
